  <g font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="700">
    <rect x="80" y="486" width="300" height="72" rx="16" fill="#131d31" stroke="#6366f1" stroke-width="2" />
    <text x="230" y="531" text-anchor="middle" fill="#a5b4fc">Plan</text>
    <rect x="406" y="509" width="6" height="26" rx="2" fill="#fbbf24" /><rect x="418" y="509" width="6" height="26" rx="2" fill="#fbbf24" />
    <rect x="450" y="486" width="300" height="72" rx="16" fill="#131d31" stroke="#38bdf8" stroke-width="2" />
    <text x="600" y="531" text-anchor="middle" fill="#7dd3fc">Spec &#8594; Tickets</text>
    <rect x="776" y="509" width="6" height="26" rx="2" fill="#fbbf24" /><rect x="788" y="509" width="6" height="26" rx="2" fill="#fbbf24" />
    <rect x="820" y="486" width="300" height="72" rx="16" fill="#131d31" stroke="#10b981" stroke-width="2" />
    <text x="970" y="531" text-anchor="middle" fill="#6ee7b7">Implement &#8594; PR</text>
