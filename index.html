<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ship-it | Disciplined Feature Delivery for Engineering Teams</title>
  <meta name="description"
    content="Drive features from idea to pull request using explicit phase gates, independent reviews, isolated subagents, and GitHub issues as the single source of truth." />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />

  <!-- Apply the theme before first paint to avoid a light flash; mirrors getStoredTheme() -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ship-it-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) { /* fall back to light */ }
    })();
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://awhipp.github.io/ship-it/" />
  <meta property="og:title" content="ship-it | Disciplined Feature Delivery for Engineering Teams" />
  <meta property="og:description"
    content="Drive features from idea to pull request using explicit phase gates, independent reviews, isolated subagents, and GitHub issues as the single source of truth." />
  <meta property="og:image" content="https://awhipp.github.io/ship-it/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="ship-it: disciplined feature delivery from idea to pull request, with three human-gated boundaries" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://awhipp.github.io/ship-it/" />
  <meta name="twitter:title" content="ship-it | Disciplined Feature Delivery for Engineering Teams" />
  <meta name="twitter:description"
    content="Drive features from idea to pull request using explicit phase gates, independent reviews, isolated subagents, and GitHub issues as the single source of truth." />
  <meta name="twitter:image" content="https://awhipp.github.io/ship-it/og-image.png" />

  <!-- Google Fonts Preconnect & Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
</head>
